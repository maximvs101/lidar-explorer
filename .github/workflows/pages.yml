name: Publier sur GitHub Pages

# Le site est en ligne : chaque commit sur `main` le republie. Les tests
# tournent avant le build, dans le job ci-dessous — publier un site dont la
# suite échoue, c'est publier un défaut connu.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois, et on laisse finir celui qui tourne :
# interrompre une publication à mi-chemin laisse le site dans un état mêlant
# deux versions.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Les tests avant le build : publier un site dont la suite échoue, c'est
      # publier un défaut connu.
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
