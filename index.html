<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Explorateur LiDAR HD</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1116;
        --panel: #151a22;
        --line: #263041;
        --text: #dfe4ea;
        --dim: #8b949e;
        --ok: #7ee787;
        --warn: #ffd479;
        --err: #ff7b72;
        --accent: #7fd1ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font: 13px/1.55 ui-monospace, Consolas, monospace;
        display: grid; grid-template-columns: minmax(400px, 440px) 1fr; height: 100vh; overflow: hidden;
      }
      #panel { padding: 14px 16px; overflow-y: auto; border-right: 1px solid var(--line); }
      #right { display: grid; grid-template-rows: 1fr 1fr; min-width: 0; min-height: 0; }
      #map { width: 100%; height: 100%; background: #10141a; }
      #stage { position: relative; min-height: 0; border-top: 1px solid var(--line);
               background: #080a0e; }
      #view { display: block; width: 100%; height: 100%; }
      #hud { position: absolute; left: 8px; bottom: 8px; padding: 5px 9px; border-radius: 4px;
             background: rgba(10, 13, 18, .82); border: 1px solid var(--line);
             font-size: 11px; color: var(--dim); pointer-events: none; }
      #hud b { color: var(--text); font-weight: 600; }
      h1 { font-size: 14px; margin: 0 0 3px; color: var(--accent); }
      p.sub { margin: 0 0 12px; color: var(--dim); font-size: 12px; }
      h2 { font-size: 11px; margin: 16px 0 5px; color: var(--dim);
           text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
      button {
        background: var(--panel); color: var(--text); border: 1px solid var(--line);
        padding: 6px 11px; border-radius: 5px; cursor: pointer; font: inherit; margin: 0 5px 5px 0;
      }
      button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
      button:disabled { opacity: .4; cursor: default; }
      table { border-collapse: collapse; width: 100%; font-size: 12px; }
      td { padding: 1px 8px 1px 0; vertical-align: top; }
      td.k { color: var(--dim); white-space: nowrap; }
      td.v { text-align: right; font-variant-numeric: tabular-nums; word-break: break-word; }
      .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
      .dim { color: var(--dim); }
      #log div { margin: 1px 0; white-space: pre-wrap; font-size: 12px; }
      .check { display: flex; gap: 7px; align-items: baseline; margin: 3px 0; font-size: 12px; }
      .check .mark { width: 1.1em; flex: none; }
      #notice { padding: 9px 11px; border-radius: 5px; border: 1px solid var(--line);
                background: var(--panel); margin: 10px 0; font-size: 12px; display: none; }
      #notice.show { display: block; }
      #notice.miss { border-color: #6b4a2a; background: #22190f; }
      .leaflet-container { font: inherit; background: #10141a; }
      .leaflet-control-attribution { font-size: 10px !important; }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>Explorateur LiDAR HD</h1>
      <p class="sub">Cliquez sur la carte pour choisir un lieu. Les données sont lues directement chez l'IGN.</p>

      <div id="notice"></div>

      <div>
        <button id="load" disabled>Charger le nuage</button>
        <button id="clear">Vider le cache</button>
      </div>
      <div id="log"></div>

      <h2>Dalle</h2>
      <div id="tile"><span class="dim">aucun lieu sélectionné</span></div>

      <h2>Contrôles</h2>
      <div id="checks"><span class="dim">—</span></div>

      <h2>Compteurs</h2>
      <div id="stats"><span class="dim">—</span></div>
    </div>
    <div id="right">
      <div id="map"></div>
      <div id="stage">
        <canvas id="view"></canvas>
        <div id="hud">cliquez sur la carte pour choisir un lieu</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
